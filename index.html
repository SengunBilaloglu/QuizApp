<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="init()">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">QuizApp</span>
        </div>
    </nav>

    <section class="container">
        <section class="card quiz-card">
            <img src="./img/question.jpg" class="card-img-top" alt="...">
            <div class="card-body">
                <h4 class="card-title" id="question-text">Frage</h4>

                <div class="card mb-2 quiz-answer-card" id="answer1" onclick="answer('answer1')">
                    <div class="card-body">
                        Antwort
                    </div>
                </div>
                <div class="card mb-2 quiz-answer-card" id="answer2" onclick="answer('answer2')">
                    <div class="card-body">
                        Antwort
                    </div>
                </div>
                <div class="card mb-2 quiz-answer-card" id="answer3" onclick="answer('answer3')">
                    <div class="card-body">
                        Antwort
                    </div>
                </div>
                <div class="card mb-2 quiz-answer-card" id="answer4" onclick="answer('answer4')">
                    <div class="card-body">
                        Antwort
                    </div>
                </div>

                <div class="question-footer">
                    <span>
                        <b id="question-nummer">1</b> von <b id="all_questions">5</b> Fragen
                    </span>

                    <button type="button" onclick="nextQuestion()" id="next-button" class="btn btn-primary" disabled>Nächste Frage</button>
                </div>
            </div>
        </section>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
